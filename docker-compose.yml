services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitanda
      POSTGRES_PASSWORD: kitanda
      POSTGRES_DB: kitanda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitanda"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kitanda:kitanda@db:5432/kitanda
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  # O serviço "web" é adicionado na Fase 8.

volumes:
  pgdata:
