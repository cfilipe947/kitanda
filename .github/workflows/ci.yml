name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitanda
          POSTGRES_PASSWORD: kitanda
          POSTGRES_DB: kitanda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kitanda:kitanda@localhost:5432/kitanda_test
      DATABASE_URL_TEST: postgresql://kitanda:kitanda@localhost:5432/kitanda_test
      JWT_SECRET: ci-secret-com-pelo-menos-32-caracteres!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate:deploy -w apps/api
      - run: npm test
      - run: npm run build
